name: Code Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-task-markers:
    name: "No TODO comments"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check added lines in pull request
        uses: phntmxyz/pr_todo_checker@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Docs may contain intentionally long-lived task notes.
          exclude: |
            docs/**
          # Allow issue-linked TODOs such as TODO(#123).
          custom_ignore_matcher: 'TODO(#'

  build-linux:
    name: "Build (Linux)"
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "500M"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-build-${{ github.sha }}
          restore-keys: ccache-linux-build-

      - name: Configure
        run: nix develop --command just configure-release-no-tests

      - name: Build
        run: nix develop --command just build

  test-linux:
    name: "Test (Linux)"
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "500M"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-test-${{ github.sha }}
          restore-keys: ccache-linux-test-

      - name: Configure
        run: nix develop --command just configure-debug

      - name: Test
        run: nix develop --command just test

  sanitize-linux:
    name: "Sanitize (Linux)"
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "500M"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-sanitize-${{ github.sha }}
          restore-keys: ccache-linux-sanitize-

      - name: Configure
        run: nix develop --command just configure-sanitize

      - name: Test
        run: nix develop --command just test

  build-windows:
    name: "Build (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-windows-
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: just configure-release-no-tests
      - name: Build
        run: just build

  test-windows:
    name: "Test (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-windows-
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: just configure-debug
      - name: Test
        run: just test

  format:
    name: "Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check C++ formatting
        run: nix develop --command just check-format-cpp

      - name: Check Lua formatting
        run: nix develop --command just check-format-lua

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so a PR can diff its changed files against the base.
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: nix develop --command just configure-debug

      # On a PR, lint only the C++ files this branch changed (fast). On a push
      # to main (merge) the full sweep runs, so anything a scoped PR missed
      # (e.g. a header-only change) is still caught before it lands.
      - name: Lint C++ (changed files)
        if: github.event_name == 'pull_request'
        run: nix develop --command just lint-cpp-since ${{ github.event.pull_request.base.sha }}

      - name: Lint C++ (full sweep)
        if: github.event_name != 'pull_request'
        run: nix develop --command just lint-cpp

      - name: Lint Lua
        run: nix develop --command just lint-lua
