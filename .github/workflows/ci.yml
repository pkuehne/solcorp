name: Code Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-task-markers:
    name: "No task markers"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check added lines in pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --unified=0 --no-color "$BASE_SHA" "$HEAD_SHA" -- ':(glob)**/*.h' ':(glob)**/*.cpp' \
            | grep -E '^\+.*//.*\<TODO\>'; then
            echo "Found TODO comments in added C++ lines. Please track follow-up work in an issue instead of adding bare TODO markers."
            exit 1
          fi

  build-linux:
    name: "Build (Linux)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: nix develop --command just configure-release-no-tests

      - name: Build
        run: nix develop --command just build

  test-linux:
    name: "Test (Linux)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: nix develop --command just configure-debug

      - name: Test
        run: nix develop --command just test

  sanitize-linux:
    name: "Sanitize (Linux)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: nix develop --command just configure-sanitize

      - name: Test
        run: nix develop --command just test

  build-windows:
    name: "Build (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Cache CMake FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-windows-
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: just configure-release-no-tests
      - name: Build
        run: just build

  test-windows:
    name: "Test (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Cache CMake FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-windows-
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: just configure-debug
      - name: Test
        run: just test

  format:
    name: "Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check C++ formatting
        run: nix develop --command just check-format-cpp

      - name: Check Lua formatting
        run: nix develop --command just check-format-lua

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: nix develop --command just configure-debug

      - name: Lint C++
        run: nix develop --command just lint-cpp

      - name: Lint Lua
        run: nix develop --command just lint-lua
