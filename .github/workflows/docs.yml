name: Deploy Docs
on:
  push:
    branches:
      - main
    paths:
      - docs/**
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/
      - uses: actions/deploy-pages@v5
        id: deployment
