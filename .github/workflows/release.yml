name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload artifacts to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: "Package Linux"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Set up Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-linux-release-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-linux-release-

      - name: Configure
        run: nix develop --command just configure-release-no-tests

      - name: Build
        run: nix develop --command just build

      - name: Package
        run: nix develop --command just package

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/SolCorp-*.zip

  build-windows:
    name: "Package Windows"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Cache CMake FetchContent
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-windows-release-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: fetchcontent-windows-release-

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: just configure-release-no-tests

      - name: Build
        run: just build

      - name: Package
        run: just package

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/SolCorp-*.zip
